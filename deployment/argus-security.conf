# ARGUS Payments — browser / transport security hardening.
# Keep third-party media processing functional: the camera model downloads only
# its fixed, public SDK/WASM; no customer biometric bytes are sent to that CDN.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<IfModule mod_headers.c>
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "DENY"
  Header always set Referrer-Policy "no-referrer"
  Header always set Strict-Transport-Security "max-age=31536000"
  Header always set X-Permitted-Cross-Domain-Policies "none"
  Header always set Cross-Origin-Opener-Policy "same-origin"
  Header always set Cross-Origin-Resource-Policy "same-origin"
  Header always set Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
  Header always set Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
  Header always unset X-Powered-By
  # API and private account pages must not be cached by proxies or browsers.
  SetEnvIf Request_URI "^/(api/|conta(?:/|$)|admin(?:/|$))" ARGUS_PRIVATE=1
  Header always set Cache-Control "private, no-store, max-age=0" env=ARGUS_PRIVATE
  Header always set Pragma "no-cache" env=ARGUS_PRIVATE
</IfModule>

<Directory "/var/www/html/public">
  Options -Indexes -Includes -ExecCGI
  AllowOverride All
  Require all granted
  LimitRequestBody 8388608
</Directory>

# These paths should never be public even if the document root changes.
<LocationMatch "^/(?:\.git(?:/|$)|\.svn(?:/|$)|\.hg(?:/|$)|\.env(?:\.|$)|vendor(?:/|$)|src(?:/|$)|tests(?:/|$)|storage(?:/|$)|composer\.(?:json|lock)$|server-status(?:/|$)|phpinfo\.php$)">
  Require all denied
</LocationMatch>

<FilesMatch "(?i)^(?:\.|.*\.(?:sql|sqlite|db|bak|backup|old|log|env|ini|inc|pem|key|p12|pfx|crt|zip|tgz|tar|gz))$">
  Require all denied
</FilesMatch>


# Only Apache's local Render reverse proxy may supply client IPs.
# Never trust arbitrary internet X-Forwarded-For headers.
<IfModule mod_remoteip.c>
  RemoteIPHeader X-Forwarded-For
  RemoteIPTrustedProxy 127.0.0.1
  RemoteIPTrustedProxy ::1
</IfModule>

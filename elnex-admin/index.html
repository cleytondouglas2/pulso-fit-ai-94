<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ELNEX • Central Administrativa</title><meta name="theme-color" content="#120a20"><style>
:root{font:15px/1.48 system-ui,-apple-system,sans-serif;color:#f8f1ff;background:#0e0919}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 0 0,#43206070,transparent 37%),#0e0919;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}input,textarea,select{width:100%;padding:13px 14px;border:1px solid #604475;background:#19102a;color:white;border-radius:12px;outline:none}input:focus,textarea:focus,select:focus{border-color:#d867e2}label{display:block;color:#ae9bc0;font-size:12px;margin:12px 0 6px}.btn{background:linear-gradient(105deg,#9254ed,#ed57b6);color:#fff;font-weight:730;border:0;border-radius:12px;padding:12px 18px;transition:filter .2s,transform .2s}.btn:hover{filter:brightness(1.14);transform:translateY(-1px)}.btn.alt{background:#332344;color:#e7d7f4}.btn.danger{background:#78304e}.btn:focus-visible,.side button:focus-visible{outline:2px solid #f1a8f0;outline-offset:3px}
#login{max-width:435px;margin:10vh auto;padding:32px 28px;background:#1d122b;border:1px solid #54356f;border-radius:26px;box-shadow:0 18px 70px #050309a1}h1,h2,h3,p{margin-top:0}h1{font-size:30px;letter-spacing:-1px}h2{font-size:21px}.brand{font-size:25px;font-weight:900;letter-spacing:2.7px;color:#f0b4f3}.brand em{font-size:12px;vertical-align:middle;color:#b59dcc;font-style:normal;letter-spacing:1px}.muted{color:#ad9abf}.small{font-size:12px}.note{margin-top:15px;white-space:pre-wrap;background:#2c1d3e;border:1px solid #694578;border-radius:12px;padding:12px;color:#f5ddfc;overflow-wrap:anywhere}.hidden{display:none!important}
#app{display:flex;min-height:100vh}.side{width:250px;flex-shrink:0;background:#190f29;border-right:1px solid #392348;padding:24px 15px;display:flex;flex-direction:column;gap:7px}.side .brand{margin:6px 10px 28px}.side button{display:flex;align-items:center;gap:14px;text-align:left;border:0;background:transparent;color:#bba6cd;padding:15px;border-radius:13px;font-weight:700;white-space:nowrap}.side button.active,.side button:hover{background:linear-gradient(90deg,#6d37a648,#d347ba22);color:#fff}.side #logout{margin-top:auto;color:#f0bbdd}
.main{flex:1;padding:35px;min-width:0;max-width:1620px}.eyebrow{color:#b87ce7;letter-spacing:2px;font-size:10px;font-weight:800}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:32px}.pill{background:#281a3d;border:1px solid #573977;color:#e5cafa;border-radius:99px;padding:10px 14px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.stat,.panel,.item{border:1px solid #402c52;background:linear-gradient(145deg,#241734,#1a1129);border-radius:17px;padding:19px}.stat .k{color:#bea5d2;font-size:12px}.stat strong{font-size:35px;display:block;margin:10px 0}.stat .small{color:#88769d}.panel{margin-top:20px}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:16px}.toolbar input{max-width:360px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.item{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;overflow-wrap:anywhere}.item p{color:#b39cc9;margin:5px 0}.item .actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.item .actions .btn{font-size:12px;padding:9px 11px}.empty{text-align:center;color:#bba6cd;padding:42px}.eventform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.eventform .wide{grid-column:span 2}.alert{padding:12px 15px;background:#3a1a34;color:#ffc8df;border-radius:10px;margin-bottom:15px;white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.main{padding:22px}}@media(max-width:650px){#app{flex-direction:column}.side{position:sticky;top:0;z-index:5;width:100%;padding:8px 12px;flex-direction:row;align-items:center;overflow-x:auto;box-shadow:0 8px 20px #090614aa}.side .brand{font-size:15px;letter-spacing:1px;margin:0 12px 0 0}.side .brand em{display:none}.side button{padding:11px 12px;gap:7px;font-size:12px}.side button span{display:none}.side #logout{margin:0}.main{padding:22px 14px}.top{align-items:flex-start}.top .pill{font-size:11px;max-width:125px}.item{flex-direction:column}.item .actions{justify-content:flex-start}.eventform{grid-template-columns:1fr}.eventform .wide{grid-column:span 1}#login{margin:8vh 12px}.stat strong{font-size:28px}}
</style></head><body>
<section id="login"><div class="brand">ELNEX <em>ADMIN</em></div><h1 style="margin-top:25px">Central de comando</h1><p class="muted">Gestão segura da plataforma, com acesso restrito a administradores autorizados.</p><form id="loginForm"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required placeholder="seu@email.com"><label for="pass">Senha</label><input id="pass" type="password" autocomplete="current-password" required placeholder="Sua senha"><button class="btn" style="width:100%;margin-top:20px" type="submit">Entrar na administração</button></form><button class="btn alt" style="width:100%;margin-top:10px" id="recover">Esqueci minha senha</button><div id="loginNotice" class="note hidden" role="status"></div><p class="small muted" style="margin-top:20px">Nunca informe sua senha a terceiros. Este painel não solicita chaves administrativas do Supabase.</p></section>
<div id="app" class="hidden"><nav class="side"><div class="brand">ELNEX <em>ADMIN</em></div><button data-tab="overview" class="active">✦ <span>Visão geral</span></button><button data-tab="users">♙ <span>Usuários</span></button><button data-tab="reports">⚑ <span>Denúncias</span></button><button data-tab="verifications">✓ <span>Trust ID</span></button><button data-tab="events">▤ <span>Eventos</span></button><button id="logout">↪ <span>Sair</span></button></nav><main class="main"><div class="top"><div><div class="eyebrow">ELNEX • GESTÃO DA PLATAFORMA</div><h1 id="title">Visão geral</h1></div><div class="pill">✓ Administração autenticada</div></div><div id="err" class="alert hidden" role="alert"></div><div id="content"></div></main></div>
<script>
const API="https://kcfevcznssxoacuimeqs.supabase.co",KEY="sb_publishable_q2SgD-_OSE-T_17-pedRvw_YTM5j-rk",S=sessionStorage,K='elnex-admin-session-v1';let token='',refreshToken='',userId='',tab='overview',records=[];
const $=s=>document.querySelector(s),esc=x=>String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");
const h=()=>({'apikey':KEY,'Authorization':'Bearer '+(token||KEY),'Content-Type':'application/json'});
function notice(s){$('#loginNotice').textContent=s;$('#loginNotice').classList.remove('hidden')}
function error(s){$('#err').textContent=s;$('#err').classList.remove('hidden')}
function clearError(){$('#err').classList.add('hidden')}
function save(){S.setItem(K,JSON.stringify({token,refreshToken}))}
function reset(){S.removeItem(K);token='';refreshToken='';userId='';$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}
async function call(path,opts={},retry=true){let r=await fetch(API+path,{...opts,headers:{...h(),...opts.headers}});
if(r.status===401&&retry&&refreshToken){try{const x=await fetch(API+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refreshToken})});if(x.ok){const d=await x.json();token=d.access_token;refreshToken=d.refresh_token;save();return call(path,opts,false)}}catch{}}return r;}
async function json(path,opts={}){const r=await call(path,opts);const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{d=raw};if(!r.ok)throw Error(typeof d==='object'?(d.msg||d.message||d.error_description||d.error||'Erro '+r.status):String(d));return {data:d,response:r}}
async function verify(){const u=(await json('/auth/v1/user')).data;userId=u.id;const a=(await json('/rest/v1/app_admins?select=user_id&user_id=eq.'+encodeURIComponent(userId))).data;if(!Array.isArray(a)||!a.length)throw Error('Conta sem permissão administrativa. Verifique se o e-mail foi confirmado.');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await load()}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();notice('Validando acesso...');try{const r=await fetch(API+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value.trim(),password:$('#pass').value})});const d=await r.json();if(!r.ok)throw Error(d.msg||d.message||d.error_description||'Falha no login');token=d.access_token;refreshToken=d.refresh_token;save();await verify();$('#pass').value='';$('#loginNotice').classList.add('hidden')}catch(ex){notice(ex.message||String(ex))}});
$('#recover').addEventListener('click',async()=>{const email=$('#email').value.trim();if(!email.includes('@'))return notice('Digite seu e-mail acima.');try{await json('/auth/v1/recover',{method:'POST',body:JSON.stringify({email})});notice('Se o endereço estiver cadastrado, o Supabase enviará as instruções, desde que o SMTP esteja configurado.')}catch(e){notice(e.message)}});
$('#logout').addEventListener('click',async()=>{try{await call('/auth/v1/logout',{method:'POST'})}catch{}reset()});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(n=>n.classList.toggle('active',n===b));load()}));
async function getRows(table,order='created_at'){return (await json('/rest/v1/'+table+'?select=*&order='+order+'.desc&limit=200')).data}
async function count(table,filter=''){const r=await call('/rest/v1/'+table+'?select=id'+filter,{method:'HEAD',headers:{Prefer:'count=exact'}});if(!r.ok)throw Error('Falha ao contar '+table+' ('+r.status+')');return parseInt((r.headers.get('content-range')||'0/0').split('/')[1]||'0',10)||0}
const labels={overview:'Visão geral',users:'Usuários',reports:'Denúncias',verifications:'Trust ID',events:'Eventos'};
async function load(){clearError();$('#title').textContent=labels[tab];$('#content').innerHTML='<div class="empty">Carregando registros…</div>';try{if(tab==='overview'){const vals=await Promise.all([count('profiles'),count('matches'),count('reports','&status=eq.pending'),count('events')]);$('#content').innerHTML='<div class="stats">'+['Usuários','Matches','Denúncias pendentes','Eventos'].map((name,i)=>'<div class="stat"><div class="k">'+name+'</div><strong>'+vals[i].toLocaleString('pt-BR')+'</strong><div class="small">Dados do banco ELNEX</div></div>').join('')+'</div><div class="panel"><h2>Bem-vindo à central ELNEX</h2><p class="muted">Aqui você administra verificações de identidade, denúncias, suspensão de contas, planos ELNEX+ e experiências.</p><button class="btn alt" id="reload">Atualizar dados</button></div>';$('#reload').onclick=load;return}const table={users:'profiles',reports:'reports',verifications:'verification_requests',events:'events'}[tab];records=await getRows(table,tab==='events'?'start_at':'created_at');renderList()}catch(e){error(e.message);$('#content').innerHTML=''} }
function renderList(){const q=$('#filter')?.value?.toLowerCase()||'';let filtered=records.filter(x=>JSON.stringify(x).toLowerCase().includes(q));const toolbar='<div class="toolbar"><input id="filter" placeholder="Filtrar registros" value="'+esc(q)+'"><button class="btn alt" id="reload">Atualizar</button></div>';
let form=tab==='events'?'<section class="panel" style="margin:0 0 20px"><h2>Novo evento</h2><form id="eventForm" class="eventform"><input name="title" placeholder="Título do evento" required maxlength="120"><input name="city" placeholder="Cidade" required><input name="date" type="datetime-local" required><input name="place" placeholder="Local público"><input name="capacity" type="number" min="1" max="10000" value="50"><input name="description" placeholder="Descrição"><button class="btn wide">Publicar evento</button></form></section>':'';
const cards=filtered.map((r,i)=>{let label=tab==='users'?(r.display_name||r.handle):tab==='reports'?('Denúncia: '+r.reason):tab==='verifications'?'Solicitação Trust ID':r.title;
let meta=tab==='users'?(r.city||'Sem cidade')+' • '+r.status:tab==='reports'?('Denunciado: '+r.reported_id):tab==='verifications'?('Solicitante: '+r.user_id):r.city+' • '+(r.start_at?new Date(r.start_at).toLocaleString('pt-BR'):'');
let btns=tab==='users'?'<button class="btn alt" data-act="suspend" data-i="'+i+'">'+(r.status==='suspended'?'Reativar':'Suspender')+'</button><button class="btn alt" data-act="plus" data-i="'+i+'">♛ ELNEX+</button>':tab==='reports'&&r.status==='pending'?'<button class="btn" data-act="review" data-i="'+i+'">Concluir análise</button><button class="btn alt" data-act="dismiss" data-i="'+i+'">Arquivar</button>':tab==='verifications'&&r.status==='pending'?'<button class="btn alt" data-act="photo" data-i="'+i+'">Ver foto</button><button class="btn" data-act="approve" data-i="'+i+'">Aprovar</button><button class="btn danger" data-act="reject" data-i="'+i+'">Recusar</button>':'';
return '<article class="item"><div><strong>'+esc(label)+'</strong><p>'+esc(meta)+'</p><div class="small muted">'+esc(tab==='reports'?r.details||r.status:tab==='events'?r.description||'':r.created_at?new Date(r.created_at).toLocaleString('pt-BR'):'')+'</div></div><div class="actions">'+btns+'</div></article>'}).join('');
$('#content').innerHTML=form+toolbar+'<div class="grid">'+(cards||'<div class="empty">Nenhum registro encontrado.</div>')+'</div>';$('#filter').addEventListener('input',e=>{const val=e.target.value.toLowerCase();document.querySelectorAll('.item').forEach((node,i)=>{node.style.display=JSON.stringify(filtered[i]).toLowerCase().includes(val)?'':'none'})});$('#reload').onclick=load;
if($('#eventForm'))$('#eventForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await rpc('admin_set_event',{p_title:String(f.get('title')),p_city:String(f.get('city')),p_start_at:new Date(String(f.get('date'))).toISOString(),p_description:String(f.get('description')),p_location_hint:String(f.get('place')),p_capacity:Number(f.get('capacity'))});await load()}catch(x){error(x.message)}};
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act,filtered[Number(b.dataset.i)]));
}
async function rpc(name,body){return (await json('/rest/v1/rpc/'+name,{method:'POST',body:JSON.stringify(body)})).data}
async function action(name,r){try{
if(name==='suspend'){if(!confirm((r.status==='suspended'?'Reativar':'Suspender')+' esta conta?'))return;await rpc('admin_suspend',{p_user:r.id,p_suspend:r.status!=='suspended'})}
if(name==='plus'){const days=prompt('Dias de ELNEX+ (0 para cancelar, até 365):','30');if(days===null)return;if(!/^(0|[1-9][0-9]{0,2})$/.test(days)||+days>365)throw Error('Informe de 0 a 365 dias');await rpc('admin_grant_plus',{p_user:r.id,p_days:+days})}
if(name==='review'||name==='dismiss')await rpc('review_report',{p_id:r.id,p_status:name==='review'?'reviewed':'dismissed'});
if(name==='approve'||name==='reject'){if(!confirm('Confirmar esta decisão sobre a verificação?'))return;await rpc('review_verification',{p_id:r.id,p_approve:name==='approve'})}
if(name==='photo'){if(!r.file_path)throw Error('Foto indisponível');const d=(await json('/storage/v1/object/sign/elnex_verify/'+r.file_path,{method:'POST',body:JSON.stringify({expiresIn:60})})).data;window.open(API+'/storage/v1'+d.signedURL,'_blank','noopener');return}
await load();
}catch(e){error(e.message)}}
(async()=>{try{const old=JSON.parse(S.getItem(K)||'null');if(old?.token){token=old.token;refreshToken=old.refreshToken||'';await verify()}}catch(e){reset();if(e.message)notice(e.message)}})();
</script></body></html>

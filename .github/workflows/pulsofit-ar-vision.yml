name: PulsoFit - IA real na camera e treinador 3D
on:
  push:
    branches: [main]
    paths:
      - "server/pulsofit-ar-pose-engine.js"
      - "server/pulsofit-ar-vision-ui.js"
      - "server/pulsofit-ar-vision.test.mjs"
      - "server/pulsofit-camera-ar.js"
      - "server/pulsofit-plans-patch.mjs"
      - ".github/workflows/pulsofit-ar-vision.yml"
  pull_request:
    paths:
      - "server/pulsofit-ar-vision.test.mjs"
      - "server/pulsofit-camera-ar.js"
      - "server/pulsofit-ar-pose-engine.js"
      - "server/pulsofit-ar-vision-ui.js"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          node --check server/pulsofit-ar-pose-engine.js
          node --check server/pulsofit-ar-vision-ui.js
          node --check server/pulsofit-camera-ar.js
          node --check server/pulsofit-plans-patch.mjs
          node --check server/pulsofit-ar-vision.test.mjs
      - run: node --test server/pulsofit-ar-vision.test.mjs server/pulsofit-ar-music.test.mjs server/pulsofit-ux-v3.test.mjs

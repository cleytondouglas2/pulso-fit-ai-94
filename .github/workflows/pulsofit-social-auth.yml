name: PulsoFit - Google e Apple login oficial
on:
  push:
    branches: [main]
    paths:
      - "server/pulsofit-social-auth.mjs"
      - "server/pulsofit-social-ui.js"
      - "server/pulsofit-social-auth.test.mjs"
      - "server/misticpay-runtime.mjs"
      - "server/pulsofit-plans-patch.mjs"
      - ".github/workflows/pulsofit-social-auth.yml"
  pull_request:
    paths:
      - "server/pulsofit-social-auth.mjs"
      - "server/pulsofit-social-ui.js"
      - "server/pulsofit-social-auth.test.mjs"
      - "server/misticpay-runtime.mjs"
      - "server/pulsofit-plans-patch.mjs"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check server/pulsofit-social-auth.mjs
      - run: node --check server/pulsofit-social-ui.js
      - run: node --check server/pulsofit-plans-patch.mjs
      - run: node --test server/pulsofit-social-auth.test.mjs

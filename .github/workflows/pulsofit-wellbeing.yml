name: PulsoFit - Aulas de bem-estar e videos oficiais
on:
  push:
    branches: [main]
    paths:
      - "server/pulsofit-wellbeing-lessons.js"
      - "server/pulsofit-wellbeing-ui.js"
      - "server/pulsofit-wellbeing.test.mjs"
      - "server/pulsofit-mais-menu.js"
      - "server/pulsofit-plans-patch.mjs"
      - ".github/workflows/pulsofit-wellbeing.yml"
  pull_request:
    paths:
      - "server/pulsofit-wellbeing-lessons.js"
      - "server/pulsofit-wellbeing-ui.js"
      - "server/pulsofit-wellbeing.test.mjs"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          node --check server/pulsofit-wellbeing-lessons.js
          node --check server/pulsofit-wellbeing-ui.js
          node --check server/pulsofit-mais-menu.js
          node --check server/pulsofit-plans-patch.mjs
      - run: node --test server/pulsofit-wellbeing.test.mjs server/pulsofit-ar-motion-catalog.test.mjs server/pulsofit-ui-touch-nav.test.mjs

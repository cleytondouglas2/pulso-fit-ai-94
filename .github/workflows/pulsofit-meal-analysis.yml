name: PulsoFit - avaliação do prato e teste grátis
on:
  push:
    branches: [main]
    paths:
      - "server/pulsofit-meal-assess.mjs"
      - "server/pulsofit-meal-ui.js"
      - "server/pulsofit-meal.test.mjs"
      - "server/pulsofit-mais-menu.js"
      - "server/pulsofit-plans-patch.mjs"
      - "server/misticpay-runtime.mjs"
      - ".github/workflows/pulsofit-meal-analysis.yml"
  pull_request:
    paths:
      - "server/pulsofit-meal-assess.mjs"
      - "server/pulsofit-meal-ui.js"
      - "server/pulsofit-meal.test.mjs"
      - "server/misticpay-runtime.mjs"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check server/pulsofit-meal-assess.mjs
      - run: node --check server/pulsofit-meal-ui.js
      - run: node --check server/pulsofit-plans-patch.mjs
      - run: node --check server/misticpay-runtime.mjs
      - run: node --test server/pulsofit-meal.test.mjs

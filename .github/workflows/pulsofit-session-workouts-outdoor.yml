name: PulsoFit - sessao treinos e GPS
on:
  push:
    branches: [main]
    paths:
      - "server/pulsofit-auth-ui.js"
      - "server/pulsofit-mais-menu.js"
      - "server/pulsofit-training-lab-ui.js"
      - "server/pulsofit-outdoor-ui.js"
      - "server/pulsofit-outdoor-api.mjs"
      - "server/pulsofit-session-workouts-outdoor.test.mjs"
      - "server/pulsofit-training-lab.test.mjs"
      - "server/pulsofit-outdoor.test.mjs"
      - ".github/workflows/pulsofit-session-workouts-outdoor.yml"
  pull_request:
    paths:
      - "server/pulsofit-auth-ui.js"
      - "server/pulsofit-training-lab-ui.js"
      - "server/pulsofit-outdoor-ui.js"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check server/pulsofit-auth-ui.js
      - run: node --check server/pulsofit-training-lab-ui.js
      - run: node --check server/pulsofit-outdoor-ui.js
      - run: node --check server/pulsofit-outdoor-api.mjs
      - run: node --test server/pulsofit-session-workouts-outdoor.test.mjs
      - run: node --test server/pulsofit-training-lab.test.mjs
      - run: node --test server/pulsofit-outdoor.test.mjs

name: PulsoFit - Coach original, botoes e navegacao
on:
  push:
    branches: [main]
    paths:
      - "server/pulsofit-coach-consent-ui.js"
      - "server/pulsofit-navigation-guard.js"
      - "server/pulsofit-touch-feedback.js"
      - "server/pulsofit-live-companion.js"
      - "server/pulsofit-plans-patch.mjs"
      - "server/pulsofit-ui-touch-nav.test.mjs"
      - "server/pulsofit-ux-v3.test.mjs"
      - ".github/workflows/pulsofit-ui-touch-nav.yml"
  pull_request:
    paths:
      - "server/pulsofit-ui-touch-nav.test.mjs"
      - "server/pulsofit-coach-consent-ui.js"
      - "server/pulsofit-navigation-guard.js"
      - "server/pulsofit-touch-feedback.js"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          node --check server/pulsofit-coach-consent-ui.js
          node --check server/pulsofit-navigation-guard.js
          node --check server/pulsofit-touch-feedback.js
          node --check server/pulsofit-live-companion.js
          node --check server/pulsofit-plans-patch.mjs
      - run: node --test server/pulsofit-ui-touch-nav.test.mjs server/pulsofit-ux-v3.test.mjs server/pulsofit-mobile-fixes.test.mjs

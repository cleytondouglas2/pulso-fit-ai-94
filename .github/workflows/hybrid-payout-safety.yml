name: ARGUS Hybrid Payout Safety

on:
  push:
    branches:
      - argus-payments-deploy
  pull_request:
    branches:
      - argus-payments-deploy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-financial-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARGUS_PAYOUTS_ENABLED: "no"
      ARGUS_HYBRID_PAYOUT_LIVE: "no"
      ARGUS_NOTIFICATIONS_WORKER_ENABLED: "no"
    steps:
      - name: Checkout isolated branch (no production secrets)
        uses: actions/checkout@v4
      - name: Verify payout flags are disabled
        run: |
          test "$ARGUS_PAYOUTS_ENABLED" = "no"
          test "$ARGUS_HYBRID_PAYOUT_LIVE" = "no"
          test "$ARGUS_NOTIFICATIONS_WORKER_ENABLED" = "no"
      - name: Check chat payout JavaScript syntax
        run: node --check deployment/chat-payout.js
      - name: Compile Docker image and execute synthetic PHP tests
        run: |
          docker build --progress=plain --tag argus-hybrid-safe:test .

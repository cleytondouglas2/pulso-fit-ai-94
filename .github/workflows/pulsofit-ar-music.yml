name: PulsoFit - câmera 3D, Spotify YouTube, plano ativo
on:
  push:
    branches: [main]
    paths:
      - "server/pulsofit-active-plan-cleanup.js"
      - "server/pulsofit-provider-playlists.js"
      - "server/pulsofit-camera-ar.js"
      - "server/pulsofit-ar-coach.mjs"
      - "server/pulsofit-coach-consent-ui.js"
      - "server/pulsofit-training-lab-ui.js"
      - "server/pulsofit-plans-patch.mjs"
      - "server/pulsofit-mais-menu.js"
      - "server/misticpay-runtime.mjs"
      - "server/pulsofit-ar-music.test.mjs"
      - ".github/workflows/pulsofit-ar-music.yml"
  pull_request:
    paths:
      - "server/pulsofit-ar-music.test.mjs"
      - "server/pulsofit-camera-ar.js"
      - "server/pulsofit-provider-playlists.js"
      - "server/pulsofit-active-plan-cleanup.js"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          node --check server/pulsofit-active-plan-cleanup.js
          node --check server/pulsofit-provider-playlists.js
          node --check server/pulsofit-camera-ar.js
          node --check server/pulsofit-ar-coach.mjs
          node --check server/pulsofit-coach-consent-ui.js
          node --check server/pulsofit-training-lab-ui.js
          node --check server/pulsofit-plans-patch.mjs
          node --check server/misticpay-runtime.mjs
      - run: node --test server/pulsofit-ar-music.test.mjs server/pulsofit-ux-v3.test.mjs server/pulsofit-mobile-fixes.test.mjs

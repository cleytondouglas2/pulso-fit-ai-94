name: PulsoFit - GPS e saudacao
on:
  push:
    branches: [main]
    paths:
      - 'server/pulsofit-outdoor-*'
      - 'server/pulsofit-home-greeting.js'
      - 'server/pulsofit-outdoor.test.mjs'
      - '.github/workflows/pulsofit-outdoor-tests.yml'
  pull_request:
    paths:
      - 'server/pulsofit-outdoor-*'
      - 'server/pulsofit-home-greeting.js'
jobs:
  outdoor-gps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check server/pulsofit-outdoor-api.mjs
      - run: node --check server/pulsofit-outdoor-ui.js
      - run: node --check server/pulsofit-home-greeting.js
      - run: node --check server/pulsofit-plans-patch.mjs
      - run: node --test server/pulsofit-outdoor.test.mjs

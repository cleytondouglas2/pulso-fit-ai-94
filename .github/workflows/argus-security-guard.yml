name: ArgusPay Security Guard
on:
  pull_request:
    branches: [argus-payments-deploy]
  push:
    branches: [argus-payments-deploy]
  schedule:
    - cron: "21 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ARGUS_PAYOUTS_ENABLED: "no"
      ARGUS_HYBRID_PAYOUT_LIVE: "no"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check ZIP secret scanning with synthetic credential
        run: python3 deployment/security_secret_scan.py --self-test
      - name: Scan tracked text AND source.zip contents (redacted)
        run: python3 deployment/security_secret_scan.py
      - name: Prepare Semgrep
        run: python3 -m pip install --disable-pip-version-check semgrep
      - name: Automated security rules (PHP and browser JS)
        run: |
          semgrep scan --config p/php --config p/javascript --config p/security-audit --metrics=off --error --json -o argus-security-results.json deployment
      - name: Upload scan findings for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argus-security-findings
          path: argus-security-results.json
          if-no-files-found: ignore
          retention-days: 14

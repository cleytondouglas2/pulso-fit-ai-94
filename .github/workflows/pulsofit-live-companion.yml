name: PulsoFit - playlist e treino ao vivo
on:
  push:
    branches: [main]
    paths:
      - "server/pulsofit-live-companion.js"
      - "server/pulsofit-live-companion.css"
      - "server/pulsofit-live-companion.test.mjs"
      - "server/pulsofit-training-lab-ui.js"
      - "server/pulsofit-outdoor-ui.js"
      - "server/pulsofit-push-server.mjs"
      - "server/pulsofit-push-sw.js"
      - "server/pulsofit-plans-patch.mjs"
      - ".github/workflows/pulsofit-live-companion.yml"
  pull_request:
    paths:
      - "server/pulsofit-live-companion.js"
      - "server/pulsofit-push-server.mjs"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check server/pulsofit-live-companion.js
      - run: node --check server/pulsofit-training-lab-ui.js
      - run: node --check server/pulsofit-outdoor-ui.js
      - run: node --check server/pulsofit-push-server.mjs
      - run: node --check server/pulsofit-plans-patch.mjs
      - run: node --test server/pulsofit-live-companion.test.mjs
